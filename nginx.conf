server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    gzip off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "no-cache" always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    # The application expects /data at the origin root. Deploy at /, not a subpath.
    location / { try_files $uri =404; }
    location = / { try_files /index.html =404; }
    # Arrays are already gzipped; send bytes, without HTTP Content-Encoding.
    location ~ \.gz$ { default_type application/octet-stream; try_files $uri =404; }
    location ~ /\. { deny all; }
}
